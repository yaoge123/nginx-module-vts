name: Feature Request
description: Suggest an idea for this module
title: "ENH: "
labels: [enhancement]

body:
  - type: checkboxes
    id: checks
    attributes:
      label: Feature Type
      description: Please check what type of feature request you would like to propose.
      options:
        - label: >
            Adding new functionality to this module
        - label: >
            Changing existing functionality in this module
        - label: >
            Removing existing functionality in this module
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: >
        Please describe what problem the feature would solve, e.g. "I wish I could use this module to ..."
      placeholder: >
        I wish I could use this module...
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: >
        Please describe how the new feature would be implemented, using psudocode if relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: >
        Please provide any relevant GitHub issues, code examples or references that help describe and support the feature request.
  - type: dropdown
    id: assistance-disclosure
    attributes:
      label: Assistance Disclosure
      description: >
        The use of AI/LLM tools is allowed, so long as it is disclosed. Knowing
        how this was produced helps us respond to it properly; it does not count
        against you. Please say whether any such tooling was used here.
      options:
        - AI used
        - AI not used
    validations:
      required: true
  - type: input
    id: assistance-description
    attributes:
      label: If AI was used, describe the extent to which it was used.
      placeholder: >
        Examples: "Claude produced the reproduction", "ChatGPT translated this
        from my native language", "the report is entirely generated"
